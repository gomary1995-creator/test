<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081125">
<title>STAR RUN · 모바일 3D 게임</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081125;color:#f0f7ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #ffffff25}#hud{position:fixed;top:max(20px,env(safe-area-inset-top));left:22px;right:22px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:3px;color:#87a5c4;font-weight:700}.score{font-size:36px;font-weight:800;letter-spacing:-2px}.small{font-size:12px;color:#91a9c5}.right{text-align:right}#pause{pointer-events:auto;border-radius:13px;background:#15243dcc;padding:12px 16px;margin-bottom:8px}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#08112555,#081125d9);padding:24px}.panel{width:min(100%,420px);text-align:center;padding:32px 26px;background:#0e1b32e8;border:1px solid #88cfff24;border-radius:28px;box-shadow:0 30px 100px #0007;backdrop-filter:blur(10px)}.pill{display:inline-block;font-size:10px;letter-spacing:3px;border:1px solid #66e8d344;color:#85f9df;border-radius:30px;padding:8px 12px}h1{font-size:clamp(42px,10vw,62px);letter-spacing:-3px;line-height:.95;margin:25px 0 16px}h1 span{color:#82f5df}p{color:#a8bed5;font-size:14px;line-height:1.8}.primary{border:0;background:#84f4dc;color:#092a2c;font-weight:800;border-radius:16px;padding:16px;width:100%;margin-top:18px;box-shadow:0 7px 35px #71ffcc20}.hint{font-size:11px;color:#7892af;margin:16px 0 0}#controls{position:fixed;bottom:max(25px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;background:#13243b99;backdrop-filter:blur(8px);width:76px;height:64px;border-radius:20px;font-size:26px}#toast{position:fixed;top:28%;width:100%;text-align:center;color:#84f4dc;font-weight:800;pointer-events:none;opacity:0;transition:opacity .15s}#load{position:fixed;bottom:15%;width:100%;text-align:center;color:#fda9aa;font-size:13px;padding:20px;pointer-events:none}.hidden{display:none!important}@media(min-width:700px){#controls{left:calc(50% - 190px);right:calc(50% - 190px)}}
</style>
</head>
<body>
<div id="hud"><div><div class="eyebrow">STAR RUN</div><div id="score" class="score">0</div><div id="distance" class="small">0 m · ◆ 0</div></div><div class="right"><button id="pause" aria-label="일시정지">Ⅱ</button><div class="small">BEST <b id="best">0</b></div></div></div>
<div id="controls"><button id="left" aria-label="왼쪽으로 이동">←</button><button id="right" aria-label="오른쪽으로 이동">→</button></div>
<div id="toast">◆ +50</div>
<div id="overlay"><section class="panel"><div class="pill">A LITTLE COSMIC ADVENTURE</div><h1 id="title">STAR<br><span>RUN.</span></h1><p id="description">별빛 길을 달리는 작은 탐험가.<br>장애물을 피하고 크리스털을 모아보세요.</p><button id="start" class="primary">탐험 시작 →</button><p class="hint">좌우 버튼 · 스와이프 · 방향키 / A D<br>크리스털 +50점 · 오래 달릴수록 빨라져요</p></section></div>
<div id="load">3D 엔진을 불러오는 중…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js" onerror="document.getElementById('load').textContent='3D 엔진 로딩 실패. 인터넷 연결을 확인하고 새로고침해 주세요.'"></script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE)return;
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:devicePixelRatio<2,powerPreference:'high-performance'});}catch(e){$('load').textContent='WebGL을 사용할 수 없어요. Chrome에서 다시 열어주세요.';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);$('load').classList.add('hidden');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x081125);scene.fog=new THREE.FogExp2(0x081125,.023);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,160);camera.position.set(0,5.4,10);camera.lookAt(0,.5,-11);
scene.add(new THREE.HemisphereLight(0xa8daff,0x192038,2.1));const sun=new THREE.DirectionalLight(0xf3d8ff,2.4);sun.position.set(-4,8,5);scene.add(sun);
const mat=(color,extra={})=>new THREE.MeshStandardMaterial({color,roughness:.65,...extra});
const trackMat=mat(0x15243a),edgeMat=mat(0x78ead5,{emissive:0x237d75,emissiveIntensity:1.2}),rockMat=mat(0xc16e95),gemMat=mat(0x78ffdd,{metalness:.3,emissive:0x168c73,emissiveIntensity:.7});
function box(w,h,d,m,x=0,y=0,z=0){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);return mesh;}
const track=box(7.6,.35,150,trackMat,0,-.3,-55);scene.add(track);
scene.add(box(.1,.12,150,edgeMat,-3.85,0,-55),box(.1,.12,150,edgeMat,3.85,0,-55));
const markers=[];for(let z=8;z>-125;z-=6){for(const x of [-1.25,1.25]){const m=box(.035,.015,2,mat(0x526482),x,-.11,z);scene.add(m);markers.push(m);}}
const starsGeo=new THREE.BufferGeometry(),starPoints=[];for(let i=0;i<240;i++)starPoints.push((Math.random()-.5)*150,8+Math.random()*60,-Math.random()*150);starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPoints,3));const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xc5dfff,size:.15}));scene.add(stars);
const scenery=[];const pillarGeo=new THREE.ConeGeometry(1,1,5);const pillarMat=mat(0x253251);for(let i=0;i<36;i++){const p=new THREE.Mesh(pillarGeo,pillarMat);const h=2+Math.random()*10;p.scale.set(1+Math.random()*2,h,1+Math.random()*2);p.position.set((i%2?1:-1)*(6+Math.random()*20),h/2-2,-i*4);scene.add(p);scenery.push(p);}
const player=new THREE.Group();player.add(box(.85,.9,.65,mat(0xc7d9f7),0,.85,0));const helmet=new THREE.Mesh(new THREE.SphereGeometry(.49,16,12),mat(0xe1ecff));helmet.position.y=1.58;player.add(helmet);player.add(box(.66,.26,.17,mat(0x16334e,{metalness:.65,roughness:.2}),0,1.58,.4));player.add(box(.38,.58,.3,mat(0x84f4dc),0,.85,-.42));const legs=[];for(const x of [-.24,.24]){const leg=box(.25,.48,.32,mat(0x718ab4),x,.25,0);legs.push(leg);player.add(leg);}scene.add(player);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(.7,24),new THREE.MeshBasicMaterial({color:0x030a15,transparent:true,opacity:.5}));shadow.rotation.x=-Math.PI/2;shadow.position.y=-.1;scene.add(shadow);
const obstacles=[],gems=[];const obstacleGeo=new THREE.DodecahedronGeometry(.72,0),gemGeo=new THREE.OctahedronGeometry(.33,0);
let state='ready',lane=0,distance=0,collected=0,score=0,speed=13,spawn=0,clock=0,last=performance.now(),toastTime=0,best=0,swipe=null;
try{best=Number(localStorage.getItem('star-run-best')||0)||0;}catch(e){}$('best').textContent=best;
function move(dir){if(state==='playing')lane=Math.max(-1,Math.min(1,lane+dir));}
function clearObjects(list){for(const o of list)scene.remove(o);list.length=0;}
function start(){clearObjects(obstacles);clearObjects(gems);lane=0;player.position.set(0,0,0);distance=0;collected=0;score=0;speed=13;spawn=.5;clock=0;state='playing';$('overlay').classList.add('hidden');$('pause').textContent='Ⅱ';$('pause').setAttribute('aria-label','일시정지');updateHud();}
function updateHud(){$('score').textContent=score.toLocaleString();$('distance').textContent=Math.floor(distance)+' m · ◆ '+collected;}
function showPanel(title,description,label){$('title').innerHTML=title;$('description').textContent=description;$('start').textContent=label;$('overlay').classList.remove('hidden');}
function pause(){if(state==='playing'){state='paused';showPanel('TAKE A<br><span>BREATH.</span>','잠깐 쉬어가도 괜찮아요. 준비되면 계속 달려요.','계속 달리기 →');$('pause').textContent='▶';$('pause').setAttribute('aria-label','계속하기');}else if(state==='paused')resume();}
function resume(){state='playing';$('overlay').classList.add('hidden');$('pause').textContent='Ⅱ';$('pause').setAttribute('aria-label','일시정지');last=performance.now();}
function finish(){state='over';best=Math.max(best,score);$('best').textContent=best;try{localStorage.setItem('star-run-best',String(best));}catch(e){}showPanel('NICE<br><span>JOURNEY.</span>',score.toLocaleString()+'점 · '+Math.floor(distance)+'m · 크리스털 '+collected+'개','다시 도전 →');}
$('start').addEventListener('click',()=>state==='paused'?resume():start());$('pause').addEventListener('click',pause);
for(const [id,dir] of [['left',-1],['right',1]])$(id).addEventListener('pointerdown',e=>{e.preventDefault();move(dir);});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','A','D','Escape'].includes(e.key))e.preventDefault();if(e.repeat)return;if(['ArrowLeft','a','A'].includes(e.key))move(-1);if(['ArrowRight','d','D'].includes(e.key))move(1);if(e.key==='Escape'||e.key===' ')pause();});
renderer.domElement.addEventListener('pointerdown',e=>{swipe={x:e.clientX,y:e.clientY,id:e.pointerId};renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointerup',e=>{if(swipe&&swipe.id===e.pointerId){const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))move(Math.sign(dx));}swipe=null;});renderer.domElement.addEventListener('pointercancel',()=>swipe=null);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause();});addEventListener('blur',()=>{if(state==='playing')pause();});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function spawnRow(){const blocked=Math.floor(Math.random()*3)-1;const rock=new THREE.Mesh(obstacleGeo,rockMat);rock.position.set(blocked*2.5,.65,-100);rock.rotation.set(Math.random(),Math.random(),.3);scene.add(rock);obstacles.push(rock);const gemLane=[-1,0,1].filter(l=>l!==blocked)[Math.random()<.5?0:1];for(let i=0;i<3;i++){const gem=new THREE.Mesh(gemGeo,gemMat);gem.position.set(gemLane*2.5,1,-104-i*3);scene.add(gem);gems.push(gem);}}
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.04);last=now;
if(state==='playing'){
clock+=dt;distance+=speed*dt;speed=Math.min(27,13+distance/180);score=Math.floor(distance)+collected*50;spawn-=dt;if(spawn<=0){spawnRow();spawn=22/speed;}
player.position.x+=(lane*2.5-player.position.x)*Math.min(1,dt*14);player.position.y=Math.sin(clock*13)*.055;player.rotation.z=(lane*2.5-player.position.x)*-.12;legs.forEach((leg,i)=>{leg.position.z=Math.sin(clock*13+i*Math.PI)*.16;});shadow.position.x=player.position.x;
for(const m of markers){m.position.z+=speed*dt;if(m.position.z>12)m.position.z-=138;}
for(const p of scenery){p.position.z+=speed*dt;if(p.position.z>14)p.position.z-=150;}
for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.position.z+=speed*dt;if(Math.abs(o.position.z)<.8&&Math.abs(o.position.x-player.position.x)<.92){finish();break;}if(o.position.z>12){scene.remove(o);obstacles.splice(i,1);}}
if(state==='playing')for(let i=gems.length-1;i>=0;i--){const g=gems[i];g.position.z+=speed*dt;g.rotation.y+=dt*2;g.rotation.z+=dt;if(Math.abs(g.position.z)<1&&Math.abs(g.position.x-player.position.x)<.9){collected++;scene.remove(g);gems.splice(i,1);toastTime=.55;$('toast').style.opacity=1;}else if(g.position.z>12){scene.remove(g);gems.splice(i,1);}}
score=Math.floor(distance)+collected*50;updateHud();toastTime-=dt;if(toastTime<=0)$('toast').style.opacity=0;
}else if(state==='ready'){player.rotation.y=Math.sin(now*.0005)*.2;player.position.y=Math.sin(now*.002)*.08;}
renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
